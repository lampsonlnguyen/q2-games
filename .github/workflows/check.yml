name: Native Q2 Games build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native tests
        run: make check
      - name: Build native Q2 MIPS card
        run: make -j2
      - name: Verify card package
        run: |
          file dist/.games/q2-games
          unzip -l dist/q2-games.zip
      - uses: actions/upload-artifact@v4
        with:
          name: q2-games-native
          path: dist/q2-games.zip
