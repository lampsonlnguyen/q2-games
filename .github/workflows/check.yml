name: Verify Rockbox games launcher sources
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Run portable and installer tests
        run: make check
      - name: Inspect pinned target integration
        run: |
          git clone --depth 1 --branch shanlingq2 https://github.com/DiamondBond/q2-rockbox.git /tmp/q2-rockbox
          python3 tools/install_into_rockbox.py /tmp/q2-rockbox
          grep -F 'q2_games.c' /tmp/q2-rockbox/apps/plugins/SOURCES
          test -f /tmp/q2-rockbox/apps/plugins/q2_games.c
      - name: Note cross-build limitation
        run: echo "MIPS plugin cross-build needs the Shanling Q2 firmware sysroot; not included in this CI."
